name: Native hook point audit (existing UE4 binary)

on:
  workflow_dispatch:
  push:
    branches: [native-integration]
    paths:
      - .github/workflows/native-hook-audit.yml

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Download original APK split parts
        uses: actions/download-artifact@v4
        with:
          name: brightmemory-apk-part-00
          path: parts/00
          run-id: 45923420243
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: brightmemory-apk-part-01
          path: parts/01
          run-id: 45923420243
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: brightmemory-apk-part-02
          path: parts/02
          run-id: 45923420243
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: brightmemory-apk-part-03
          path: parts/03
          run-id: 45923420243
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: brightmemory-apk-part-04
          path: parts/04
          run-id: 45923420243
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: brightmemory-apk-part-05
          path: parts/05
          run-id: 45923420243
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: brightmemory-apk-part-06
          path: parts/06
          run-id: 45923420243
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: brightmemory-apk-part-07
          path: parts/07
          run-id: 45923420243
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: brightmemory-apk-part-08
          path: parts/08
          run-id: 45923420243
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: brightmemory-apk-part-09
          path: parts/09
          run-id: 45923420243
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reassemble and verify original APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work reports
          : > work/original.apk
          find parts -type f -printf '%p %s bytes\n' | sort
          for i in {00..09}; do
            f=$(find "parts/$i" -type f -name "brightmemory.apk.part$i" -print -quit)
            test -n "$f"
            cat "$f" >> work/original.apk
          done
          test "$(stat -c%s work/original.apk)" -eq 2431306902
          echo "c35b05ac7b19fd087844de2b6261d33fbe103a6a5714c5e42d6101fab07881e4  work/original.apk" | sha256sum -c -
          unzip -p work/original.apk lib/arm64-v8a/libUE4.so > work/libUE4.so
          test "$(stat -c%s work/libUE4.so)" -eq 174981736
          sha256sum work/libUE4.so | tee reports/libUE4.sha256
          file work/libUE4.so | tee reports/elf-file.txt
          readelf -hW work/libUE4.so > reports/elf-header.txt
          readelf -lW work/libUE4.so > reports/elf-program-headers.txt
          readelf -dW work/libUE4.so > reports/elf-dynamic.txt
          readelf -Ws work/libUE4.so > reports/elf-symbols.txt

      - name: Disassemble complete functions and hook candidates
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y llvm-21
          OBJDUMP="$(command -v llvm-objdump || find /usr/lib/llvm-* /usr/bin \( -type f -o -type l \) -name 'llvm-objdump*' 2>/dev/null | sort -V | head -1)"
          if [ -z "$OBJDUMP" ]; then
            echo "llvm-objdump was not installed; available LLVM binaries:"
            find /usr/lib/llvm-* /usr/bin \( -type f -o -type l \) -name '*objdump*' 2>/dev/null | sort -V || true
            exit 1
          fi
          {
            echo "Tool: $OBJDUMP"
            echo "Complete function ranges are taken from the ELF symbol table."
            echo "Evidence gathering only; no bytes are patched."
            while IFS=: read -r name addr size; do
              [ -n "$name" ] || continue
              echo
              echo "===== $name @ $addr size=$size ====="
              "$OBJDUMP" -d --demangle --no-show-raw-insn --start-address="$((addr))" --stop-address="$((addr + size))" work/libUE4.so
            done <<'SPECS'
            AddMobilePostProcessingPasses:0x78870c0:9616
            ISpatialUpscaler_AddDefaultUpscalePass:0x78fae30:1424
            ApplyResolutionFraction:0x79e5ba0:36
            GetDesiredInternalBufferSize:0x79e5c10:144
            FSceneViewExtensions_ForEachActiveViewExtension:0x8b3c1bc:400
            FDefaultTemporalUpscaler_AddPasses:0x7956ac0:1184
            Vulkan_RenderThreadPacing:0x626acb8:448
            Vulkan_Present:0x626aea8:1024
            Android_GetFramePace:0x67dac90:180
            AnalyzeFrame:0x852dd6c:1600
            SetFrameRateLimit:0x87359dc:8
            SetOverallScalabilityLevel:0x87359ec:8
            SetResolutionScaleValue:0x8735a9c:164
            SetResolutionScaleValueEx:0x8735b40:168
            SetResolutionScaleNormalized:0x8735be0:168
            ApplySettings:0x8734cfc:72
            SaveSettings:0x873500c:92
            SPECS
          } > reports/complete-hook-disassembly.txt
          grep -E "LOAD|GNU_RELRO|GNU_STACK" reports/elf-program-headers.txt > reports/elf-memory-layout.txt || true

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: brightmemory-native-hook-audit-full
          path: reports/
          if-no-files-found: error
