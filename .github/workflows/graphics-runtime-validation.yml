name: Bright Memory graphics runtime source validation

on:
  push:
    branches:
      - work/ue427-graphics-runtime-integration
    paths:
      - "config/graphics-settings.json"
      - "engine-extension/**"
      - "scripts/validate_bmi_runtime.py"
      - ".github/workflows/graphics-runtime-validation.yml"
  pull_request:
    paths:
      - "config/graphics-settings.json"
      - "engine-extension/**"
      - "scripts/validate_bmi_runtime.py"
      - ".github/workflows/graphics-runtime-validation.yml"

permissions:
  contents: read

jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate runtime bridge and vendored upscaler sources
        run: python scripts/validate_bmi_runtime.py
