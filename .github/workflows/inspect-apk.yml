name: Inspect supplied Android package
on:
  workflow_dispatch:
  push:
    paths:
      - "input/**"
      - ".github/workflows/inspect-apk.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect APK or XAPK metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path("input")
          files = [p for p in root.rglob("*") if p.is_file() and p.suffix.lower() in {".apk", ".xapk", ".apks"}] if root.exists() else []
          report = []
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              entry = {"file": str(path), "bytes": path.stat().st_size, "sha256": digest}
              try:
                  with zipfile.ZipFile(path) as z:
                      names = z.namelist()
                      entry["zip_entries"] = len(names)
                      entry["abis"] = sorted({part.split("/")[1] for part in names if part.startswith("lib/") and len(part.split("/")) > 2})
                      entry["native_libraries"] = [n for n in names if n.startswith("lib/") and n.endswith(".so")][:100]
                      entry["manifest_present"] = "AndroidManifest.xml" in names
              except zipfile.BadZipFile:
                  entry["error"] = "Not a readable ZIP/APK container"
              report.append(entry)
          pathlib.Path("package-report.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          if not files:
              print("No package found. Upload a legally obtained APK/XAPK under input/ and rerun.")
          PY

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: android-package-inspection
          path: package-report.json
          if-no-files-found: warn
