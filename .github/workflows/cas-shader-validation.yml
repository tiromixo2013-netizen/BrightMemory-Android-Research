name: Validate AMD CAS reference shaders

on:
  workflow_dispatch:
  push:
    branches: [native-integration]
    paths:
      - vendor/amd-fidelityfx-cas/**
      - .github/workflows/cas-shader-validation.yml

permissions:
  contents: read

jobs:
  compile-reference-shaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          glslangValidator --version

      - name: Compile official Vulkan GLSL CAS compute shader
        run: |
          set -euo pipefail
          mkdir -p build/cas
          glslangValidator -V -S comp \
            -Ivendor/amd-fidelityfx-cas \
            vendor/amd-fidelityfx-cas/CAS_Shader.glsl \
            -o build/cas/cas-vulkan-fp32.spv

      - name: Compile official HLSL CAS compute shader to SPIR-V
        run: |
          set -euo pipefail
          glslangValidator -D -V -S comp -e mainCS \
            -Ivendor/amd-fidelityfx-cas \
            -DCAS_SAMPLE_FP16=0 -DCAS_SAMPLE_SHARPEN_ONLY=1 \
            -DWIDTH=64 -DHEIGHT=1 -DDEPTH=1 \
            vendor/amd-fidelityfx-cas/CAS_Shader.hlsl \
            -o build/cas/cas-hlsl-fp32-sharpen.spv

      - name: Validate generated SPIR-V
        run: |
          set -euo pipefail
          spirv-val --target-env vulkan1.0 build/cas/cas-vulkan-fp32.spv
          spirv-val --target-env vulkan1.0 build/cas/cas-hlsl-fp32-sharpen.spv
          sha256sum build/cas/*.spv | tee build/cas/SHA256SUMS

      - name: Upload shader validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: amd-cas-reference-shader-validation
          path: build/cas/
          if-no-files-found: error
