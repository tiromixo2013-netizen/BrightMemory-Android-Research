name: Bright Memory UE4.27 source checks

on:
  push:
    branches:
      - work/ue427-graphics-runtime-integration
      - experimental/minimal-sgsr1-cas
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate plugin and agreed settings
        run: python3 scripts/validate_bmi_runtime.py
      - name: Verify renderer patch applies to the pinned UE4.27 reference
        run: |
          mkdir -p Engine/Source/Runtime/Renderer/Private
          curl -fsSL https://raw.githubusercontent.com/jsuk10/UE4.27plus_Custom/main/Engine/Source/Runtime/Renderer/Private/Renderer.cpp -o Engine/Source/Runtime/Renderer/Private/Renderer.cpp
          git apply --check engine-extension/renderer/patches/0001-register-bmi-spatial-upscaler.patch
