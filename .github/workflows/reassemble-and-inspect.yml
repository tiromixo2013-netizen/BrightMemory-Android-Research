name: Reassemble and inspect downloaded APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Download the six parts from the successful run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 45728055093
          pattern: downloaded-apk-part-*
          path: parts
          merge-multiple: true

      - name: Reassemble and inspect package
        shell: bash
        run: |
          set -euo pipefail
          ls -lh parts/
          test "$(find parts -maxdepth 1 -type f -name 'downloaded-package.part-*' | wc -l)" -eq 6
          cat parts/downloaded-package.part-* > BrightMemory-v1.34.apk
          sha256sum BrightMemory-v1.34.apk
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          p = pathlib.Path("BrightMemory-v1.34.apk")
          report = {
              "file": p.name,
              "bytes": p.stat().st_size,
              "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
          }
          with zipfile.ZipFile(p) as z:
              names = z.namelist()
              report["zip_entries"] = len(names)
              report["abis"] = sorted({x.split("/")[1] for x in names if x.startswith("lib/") and len(x.split("/")) > 2})
              report["native_libraries"] = [x for x in names if x.startswith("lib/") and x.endswith(".so")]
              report["ue4_libraries"] = [x for x in names if x.endswith("libUE4.so")]
              report["pak_files"] = [x for x in names if x.lower().endswith(".pak")]
              report["obb_files"] = [x for x in names if x.lower().endswith(".obb")]
          pathlib.Path("package-report.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY

      - name: Extract engine and Android entry points
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis
          unzip -p BrightMemory-v1.34.apk AndroidManifest.xml > analysis/AndroidManifest.xml
          unzip -p BrightMemory-v1.34.apk lib/arm64-v8a/libUE4.so > analysis/libUE4.so
          file analysis/libUE4.so
          (readelf -h -d -Ws analysis/libUE4.so || true) > analysis/readelf.txt
          (nm -D -C analysis/libUE4.so || true) > analysis/dynamic-symbols.txt
          strings -a analysis/libUE4.so | grep -Ei 'JNI_OnLoad|ANativeActivity_onCreate|android_main|eglSwapBuffers|vkQueuePresentKHR|FAndroid|GLES|Vulkan|SwapBuffers|Present' | sort -u > analysis/render-entry-candidates.txt || true
          unzip -Z1 BrightMemory-v1.34.apk | grep -Ei '(^|/)(main\.[0-9]+\..*\.obb|.*\.obb|.*pak|.*utoc|.*ucas)$|AssetPack|assets/' > analysis/assets-index.txt || true
      - name: Upload inspection results
        uses: actions/upload-artifact@v4
        with:
          name: brightmemory-v1.34-engine-analysis
          path: |
            package-report.json
            analysis/
          retention-days: 7

      - name: Preserve recovered APK and UE4 binary as short-lived build inputs
        uses: actions/upload-artifact@v4
        with:
          name: brightmemory-original-build-inputs
          path: |
            BrightMemory-v1.34.apk
            analysis/libUE4.so
          retention-days: 1
          compression-level: 0
