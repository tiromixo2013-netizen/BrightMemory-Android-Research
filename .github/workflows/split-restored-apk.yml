name: Split restored Bright Memory APK for local integration

on:
  push:
    branches: [native-integration]
    paths:
      - .github/workflows/split-restored-apk.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified restored APK artifact
        uses: actions/download-artifact@v4
        with:
          name: brightmemory-v1.34-restored-full-apk
          path: restored
          run-id: 45920740655
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify APK and split into transfer-sized parts
        shell: bash
        run: |
          set -euo pipefail
          APK="restored/workspace/bright-memory-infinite-v1.34.apk"
          test -s "$APK"
          test "$(stat -c%s "$APK")" -eq 2431306902
          mkdir -p split
          split -b 300M -d -a 2 "$APK" split/brightmemory.apk.part
          sha256sum split/brightmemory.apk.part* > split/SHA256SUMS
          test "$(find split -name 'brightmemory.apk.part*' | wc -l)" -eq 8
          ls -lh split

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: brightmemory-apk-part-00
          path: split/brightmemory.apk.part00
          compression-level: 0
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: brightmemory-apk-part-01
          path: split/brightmemory.apk.part01
          compression-level: 0
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: brightmemory-apk-part-02
          path: split/brightmemory.apk.part02
          compression-level: 0
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: brightmemory-apk-part-03
          path: split/brightmemory.apk.part03
          compression-level: 0
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: brightmemory-apk-part-04
          path: split/brightmemory.apk.part04
          compression-level: 0
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with:
          name: brightmemory-apk-part-05
          path: split/brightmemory.apk.part05
          compression-level: 0
      - name: Upload part 06
        uses: actions/upload-artifact@v4
        with:
          name: brightmemory-apk-part-06
          path: split/brightmemory.apk.part06
          compression-level: 0
      - name: Upload part 07
        uses: actions/upload-artifact@v4
        with:
          name: brightmemory-apk-part-07
          path: split/brightmemory.apk.part07
          compression-level: 0
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: brightmemory-apk-parts-checksums
          path: split/SHA256SUMS
