name: Split restored Bright Memory APK for local integration

on:
  push:
    branches: [native-integration]
    paths:
      - .github/workflows/split-restored-apk.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified restored APK artifact
        uses: actions/download-artifact@v4
        with:
          name: brightmemory-v1.34-restored-full-apk
          path: restored
          run-id: 45920740655
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Diagnose, verify and split APK
        shell: bash
        run: |
          set -euo pipefail
          find restored -type f -printf '%p %s bytes\\n'
          APK="restored/bright-memory-infinite-v1.34.apk"
          test -s "$APK"
          ACTUAL_SIZE="$(stat -c%s "$APK")"
          ACTUAL_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK size: $ACTUAL_SIZE bytes"
          echo "APK SHA256: $ACTUAL_SHA"
          test "$ACTUAL_SIZE" -eq 2431306902
          test "$ACTUAL_SHA" = "c35b05ac7b19fd087844de2b6261d33fbe103a6a5714c5e42d6101fab07881e4"
          mkdir -p split
          split -b 250000000 -d -a 2 "$APK" split/brightmemory.apk.part
          PART_COUNT="$(find split -maxdepth 1 -type f -name 'brightmemory.apk.part*' | wc -l)"
          echo "Generated parts: $PART_COUNT"
          test "$PART_COUNT" -eq 10
          cat split/brightmemory.apk.part* > split/reassembled-check.apk
          REASSEMBLED_SHA="$(sha256sum split/reassembled-check.apk | awk '{print $1}')"
          echo "Reassembled SHA256: $REASSEMBLED_SHA"
          test "$REASSEMBLED_SHA" = "$ACTUAL_SHA"
          rm split/reassembled-check.apk
          sha256sum split/brightmemory.apk.part* > split/SHA256SUMS
          ls -lh split

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: brightmemory-apk-part-00
          path: split/brightmemory.apk.part00
          compression-level: 0
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: brightmemory-apk-part-01
          path: split/brightmemory.apk.part01
          compression-level: 0
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: brightmemory-apk-part-02
          path: split/brightmemory.apk.part02
          compression-level: 0
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: brightmemory-apk-part-03
          path: split/brightmemory.apk.part03
          compression-level: 0
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: brightmemory-apk-part-04
          path: split/brightmemory.apk.part04
          compression-level: 0
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with:
          name: brightmemory-apk-part-05
          path: split/brightmemory.apk.part05
          compression-level: 0
      - name: Upload part 06
        uses: actions/upload-artifact@v4
        with:
          name: brightmemory-apk-part-06
          path: split/brightmemory.apk.part06
          compression-level: 0
      - name: Upload part 07
        uses: actions/upload-artifact@v4
        with:
          name: brightmemory-apk-part-07
          path: split/brightmemory.apk.part07
          compression-level: 0
      - name: Upload part 08
        uses: actions/upload-artifact@v4
        with:
          name: brightmemory-apk-part-08
          path: split/brightmemory.apk.part08
          compression-level: 0
      - name: Upload part 09
        uses: actions/upload-artifact@v4
        with:
          name: brightmemory-apk-part-09
          path: split/brightmemory.apk.part09
          compression-level: 0
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: brightmemory-apk-parts-checksums
          path: split/SHA256SUMS
